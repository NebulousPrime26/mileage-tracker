name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Suppress the Kotlin CLI welcome banner in CI.
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"
  # Where the Kotlin CLI caches its distribution on Linux runners.
  KOTLIN_CLI_CACHE: $HOME/.cache/JetBrains/Kotlin/cli

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Debug APK — runs on pushes to main and manual triggers only.
  # Pull requests do not trigger a build. No secrets required.
  # ─────────────────────────────────────────────────────────────────
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-toolchain-${{ hashFiles('**/module.yaml', '**/project.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-toolchain-

      - name: Make Kotlin wrapper executable
        run: chmod +x ./kotlin

      - name: Build debug APK
        run: ./kotlin build

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find build -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mileage-debug-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Release APK — manual trigger only. Requires signing secrets.
  #
  # Required repository secrets:
  #   KEYSTORE_BASE64   — base64-encoded .keystore file
  #   KEYSTORE_PASSWORD — storePassword from keystore.properties
  #   KEY_ALIAS         — keyAlias from keystore.properties
  #   KEY_PASSWORD      — keyPassword from keystore.properties
  #
  # Creates a GitHub Release tagged v<versionName> and attaches the
  # universal APK as a permanent downloadable asset.
  # ─────────────────────────────────────────────────────────────────
  release:
    name: Release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # required to create a release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: ${{ runner.os }}-kotlin-toolchain-${{ hashFiles('**/module.yaml', '**/project.yaml') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-toolchain-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystores"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystores/release.keystore"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p .keystores
          cat > .keystores/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystores/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Make Kotlin wrapper executable
        run: chmod +x ./kotlin

      - name: Build release AAB
        run: ./kotlin package

      - name: Find AAB
        id: find-aab
        run: |
          AAB_PATH=$(find build -name "*.aab" -type f | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "No AAB found"
            exit 1
          fi
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "Found AAB: $AAB_PATH"

      - name: Download bundletool
        run: |
          BUNDLETOOL_VERSION="1.18.3"
          curl -sSL \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o "$RUNNER_TEMP/bundletool.jar"

      - name: Convert AAB to universal APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="${{ steps.find-aab.outputs.aab_path }}" \
            --output="$RUNNER_TEMP/mileage-release.apks" \
            --mode=universal \
            --ks="$RUNNER_TEMP/keystores/release.keystore" \
            --ks-pass="pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass="pass:$KEY_PASSWORD"

          unzip -p "$RUNNER_TEMP/mileage-release.apks" universal.apk \
            > "$RUNNER_TEMP/mileage-release.apk"

          ls -lh "$RUNNER_TEMP/mileage-release.apk"

      - name: Read version from built APK
        id: version
        run: |
          # Find the newest aapt in the preinstalled Android SDK.
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name "aapt" -type f | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::Could not locate aapt in Android SDK"
            exit 1
          fi
          echo "Using aapt: $AAPT"

          VERSION=$("$AAPT" dump badging "$RUNNER_TEMP/mileage-release.apk" \
            | grep -oP "versionName='\K[^']+")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from APK"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mileage-release-apk
          path: ${{ runner.temp }}/mileage-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mileage v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/mileage-release.apk

      - name: Clean up keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/keystores/release.keystore" || rm -f "$RUNNER_TEMP/keystores/release.keystore"