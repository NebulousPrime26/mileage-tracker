product: android/app

dependencies:
  - $compose.foundation
  - $compose.material3
  - androidx.activity:activity-compose:1.13.0
  - androidx.appcompat:appcompat:1.7.1
  - androidx.room:room-runtime:2.8.5
  - androidx.room:room-ktx:2.8.5
  - androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4
  - androidx.lifecycle:lifecycle-runtime-compose:2.9.4
  - net.zetetic:sqlcipher-android:4.13.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0

settings:
  android:
    namespace: "com.nebulousprime26.mileage_tracker"
  compose: enabled
  junit: junit-4
  kotlin:
    ksp:
      processors:
        - androidx.room:room-compiler:2.8.5
      processorOptions:
        room.schemaLocation: ./schemas